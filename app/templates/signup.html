{% extends "layout.html" %}
{% block title %}{{ msg.signup_page }}{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>{{ msg.signup_button }}</h1>
  <p class="muted">{{ msg.signup_subtitle }}</p>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form method="post" action="/signup" class="stack">
    <label>{{ msg.email }}
      <input type="email" name="email" value="{{ email or '' }}" required autocomplete="email">
    </label>
    <label>{{ msg.password }}
      <input type="password" name="password" minlength="8" maxlength="72" required autocomplete="new-password">
    </label>
    <label>{{ msg.name }}
      <input type="text" name="name" value="{{ name or '' }}" maxlength="50" required>
    </label>
    <label>{{ msg.phone_optional }}
      <input type="text" name="phone" value="{{ phone or '' }}" placeholder="010-1234-5678">
    </label>
    <button type="submit" class="btn primary block">{{ msg.signup_button }}</button>
  </form>

  <p class="muted">{{ msg.have_account }}<a href="/login">{{ msg.login_link }}</a></p>
</section>
{% endblock %}
