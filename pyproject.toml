[project]
name = "daisomall"
version = "0.1.0"
description = "다이소형 생활용품 쇼핑몰 (FastAPI + SQLite)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "psycopg[binary]>=3.2",
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["app", "tests"]
exclude = [".venv", "app/templates"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportAttributeAccessIssue = "none"
reportIndexIssue = "none"
